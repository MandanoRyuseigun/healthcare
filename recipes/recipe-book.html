<title>うちのレシピ帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: 台所の壁に貼るレシピカード。一覧はカードの棚、詳細は「材料（人数で再計算）｜作り方」の2列 */
:root{
  --bg:#eef1ec;        /* 白磁に少し緑を寄せた地 */
  --surface:#fbfcfa;
  --ink:#1f2a2b;
  --muted:#5e6a69;
  --line:#d5dbd3;
  --ai:#25467a;        /* 藍 */
  --ai-soft:#dde5f1;
  --kara:#b4801c;      /* からし */
  --kara-soft:#f3e7c9;
  --good:#3d7a4f;
  --bad:#a8433a;
  --f-head:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151b1c; --surface:#1d2526; --ink:#e7ece8; --muted:#9aa6a3; --line:#2f3a3a;
  --ai:#9db8e6; --ai-soft:#24324a; --kara:#e0b252; --kara-soft:#3a3120; --good:#7cc08f; --bad:#e08a80;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#151b1c; --surface:#1d2526; --ink:#e7ece8; --muted:#9aa6a3; --line:#2f3a3a;
  --ai:#9db8e6; --ai-soft:#24324a; --kara:#e0b252; --kara-soft:#3a3120; --good:#7cc08f; --bad:#e08a80;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0;line-height:1.35}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:14px}
.hanko{width:46px;height:46px;border-radius:50%;border:2px solid var(--bad);color:var(--bad);display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:18px;transform:rotate(-8deg);flex:none}
.brand h1{font-size:28px;letter-spacing:.04em}
.brand p{margin:0;font-size:13px}

/* tools */
.tools{display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 13px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:var(--surface)}

/* list */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 16px 14px;position:relative;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}
.card:hover{border-color:var(--ai);transform:translateY(-2px)}
.card h3{font-size:18px}
.card .sum{font-size:13px;color:var(--muted);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted)}
.cat{display:inline-block;font-size:12px;font-weight:700;color:var(--ai);background:var(--ai-soft);border-radius:4px;padding:1px 8px;align-self:flex-start}
.fav{color:var(--kara)}
.card .fav{position:absolute;top:12px;right:14px;font-size:18px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;color:var(--kara);background:var(--kara-soft);border-radius:4px;padding:0 7px}

.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 22px;background:var(--surface);max-width:640px}
.empty h2{font-size:20px;margin-bottom:8px}
.empty ul{margin:10px 0 0;padding-left:1.2em}
.empty code,.ask code{background:var(--ai-soft);color:var(--ai);border-radius:4px;padding:1px 6px;font-family:inherit}

/* detail */
.back{border:0;background:none;color:var(--ai);padding:0;margin-bottom:14px;font-weight:500}
.dhead{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.dhead h2{font-size:30px}
.dhead .sum{margin:0;max-width:62ch}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 14px;font-size:13.5px}
.btn.on{border-color:var(--kara);color:var(--kara)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.cols{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h3{font-size:17px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.serv{display:flex;align-items:center;gap:6px;font-family:var(--f-body);font-size:14px;font-weight:500}
.serv button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--bg);line-height:1}
.serv output{min-width:3.4em;text-align:center}
.scaled{font-size:12px;color:var(--kara);margin:-4px 0 8px}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dotted var(--line)}
.ing li:last-child{border-bottom:0}
.ing .q{white-space:nowrap;font-weight:500}
.ing .note{font-size:12px;color:var(--muted)}
.grp{font-size:12px;font-weight:700;color:var(--ai);padding-top:10px;letter-spacing:.06em}
.nut{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.nut div{background:var(--bg);border-radius:8px;padding:8px;text-align:center}
.nut b{display:block;font-size:17px;font-family:var(--f-head)}
.nut span{font-size:11.5px;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--ai);color:var(--surface);display:grid;place-items:center;font-size:13px;font-weight:700;margin-top:2px}
.steps li.done{color:var(--muted);text-decoration:line-through}
.steps li.done::before{background:var(--line);color:var(--muted)}
.right{display:flex;flex-direction:column;gap:18px}
.tips{background:var(--kara-soft);border-radius:var(--r);padding:14px 16px}
.tips h3{font-size:15px;color:var(--kara);margin-bottom:4px}
.tips p{margin:0;white-space:pre-wrap}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:9px 11px;resize:vertical}
.row{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.ask{font-size:13px;color:var(--muted)}
.ask p{margin:4px 0}
.status{font-size:12.5px;color:var(--good)}
.notice{padding:12px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;margin-bottom:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="hanko" aria-hidden="true">家</div>
      <div>
        <h1>うちのレシピ帳</h1>
        <p class="muted" id="count">レシピを読み込んでいます…</p>
      </div>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>

  <section id="listView">
    <div class="tools">
      <input id="q" class="search" type="search" placeholder="料理名・材料・タグで探す（例：鶏むね、作り置き）" aria-label="レシピを検索">
      <div class="chips" id="chips" role="group" aria-label="絞り込み"></div>
    </div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" hidden>
      <h2>まだレシピがありません</h2>
      <p>レシピはチャットで Claude に頼むと、ここに登録されます。</p>
      <ul>
        <li><code>冷蔵庫に鶏むね肉と小松菜がある。20分で作れる夕飯を提案して</code></li>
        <li><code>このレシピを3人分・減塩にしてレシピ帳に登録して</code></li>
        <li><code>レシピ帳の「肉じゃが」を甘さ控えめに直して</code></li>
      </ul>
    </div>
  </section>

  <section id="detailView" hidden></section>
</div>

<script>
(()=>{
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  let db = null, recipes = [], loaded = false;
  let filter = "すべて", query = "", servingsOverride = {}, doneSteps = {}, delArmed = false;

  /* ---------- 分量の計算と表記 ---------- */
  const PREFIX_UNITS = ["大さじ","小さじ","カップ"];
  const FRAC = {0.25:"1/4",0.5:"1/2",0.75:"3/4",0.33:"1/3",0.67:"2/3"};
  function frac(v, step){
    const r = Math.round(v/step)*step;
    if (r <= 0) return FRAC[step] || String(step);
    const whole = Math.floor(r + 1e-9), f = +(r - whole).toFixed(2);
    if (!f) return String(whole);
    const fs = FRAC[f] || String(f);
    return whole ? `${whole}と${fs}` : fs;
  }
  function fmtQty(qty, unit){
    unit = unit || "";
    if (qty == null || qty === "" || isNaN(Number(qty))) return unit;
    const q = Number(qty);
    if (PREFIX_UNITS.includes(unit)) return unit + frac(q, 0.25);
    if (/^(g|ml|cc|mL)$/i.test(unit)){
      const r = q < 10 ? Math.round(q*2)/2 : q < 100 ? Math.round(q) : Math.round(q/5)*5;
      return r + unit;
    }
    if (/合/.test(unit)) return frac(q, 0.5) + unit;
    return frac(q, 0.5) + unit;
  }

  /* ---------- 一覧 ---------- */
  const CATS = ["主菜","副菜","汁物","主食","作り置き","おやつ","その他"];
  function haystack(r){
    return [r.title, r.kana, r.summary, r.category, ...(r.tags||[]), ...(r.ingredients||[]).map(i=>i.name)].join(" ").toLowerCase();
  }
  function visible(){
    const q = query.trim().toLowerCase();
    return recipes.filter(r=>{
      if (filter === "お気に入り" && !r.favorite) return false;
      if (filter !== "すべて" && filter !== "お気に入り" && r.category !== filter && !(r.tags||[]).includes(filter)) return false;
      return !q || q.split(/\s+/).every(w => haystack(r).includes(w));
    });
  }
  function renderChips(){
    const used = CATS.filter(c => recipes.some(r => r.category === c || (r.tags||[]).includes(c)));
    const list = ["すべて", ...(recipes.some(r=>r.favorite) ? ["お気に入り"] : []), ...used];
    if (!list.includes(filter)) filter = "すべて";
    $("chips").innerHTML = list.map(c => `<button class="chip" type="button" data-f="${esc(c)}" aria-pressed="${c===filter}">${c==="お気に入り"?"★ ":""}${esc(c)}</button>`).join("");
  }
  function renderList(){
    $("count").textContent = loaded ? `${recipes.length} 品のレシピ` : "レシピを読み込んでいます…";
    renderChips();
    const v = visible();
    $("empty").hidden = !loaded || recipes.length > 0;
    if (loaded && recipes.length && !v.length){
      $("grid").innerHTML = `<p class="muted">「${esc(query||filter)}」に合うレシピはありません。</p>`;
      return;
    }
    $("grid").innerHTML = v.map(r => `
      <a class="card" href="#r-${esc(r.id)}">
        ${r.favorite ? '<span class="fav" aria-label="お気に入り">★</span>' : ""}
        ${r.category ? `<span class="cat">${esc(r.category)}</span>` : ""}
        <h3>${esc(r.title)}</h3>
        ${r.summary ? `<p class="sum">${esc(r.summary)}</p>` : ""}
        <div class="meta num">
          ${r.servings ? `<span>${esc(r.servings)}人分</span>` : ""}
          ${r.timeMin ? `<span>${esc(r.timeMin)}分</span>` : ""}
          ${r.nutrition && r.nutrition.kcal ? `<span>${esc(r.nutrition.kcal)}kcal/人</span>` : ""}
          ${r.cookedCount ? `<span>作った ${esc(r.cookedCount)}回</span>` : ""}
        </div>
        ${(r.tags||[]).length ? `<div class="tags">${r.tags.slice(0,4).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
      </a>`).join("");
  }

  /* ---------- 詳細 ---------- */
  function currentId(){ const h = decodeURIComponent(location.hash.slice(1)); return h.startsWith("r-") ? h.slice(2) : null; }
  function renderDetail(){
    const id = currentId();
    const r = id && recipes.find(x => x.id === id);
    $("listView").hidden = !!id;
    $("detailView").hidden = !id;
    if (!id) return;
    if (!r){
      $("detailView").innerHTML = `<button class="back" type="button" data-back>← 一覧へ</button><p class="muted">${loaded ? "このレシピは見つかりません。削除された可能性があります。" : "読み込んでいます…"}</p>`;
      return;
    }
    const base = Number(r.servings) || 1;
    const sv = servingsOverride[id] || base;
    const k = sv / base;
    let lastGroup = null;
    const ings = (r.ingredients||[]).map(i => {
      let g = "";
      if ((i.group||"") !== lastGroup){ lastGroup = i.group||""; if (i.group) g = `<li class="grp" aria-hidden="false">${esc(i.group)}</li>`; }
      const qty = (i.qty == null || i.qty === "") ? null : Number(i.qty) * k;
      return g + `<li><span>${esc(i.name)}${i.note ? `<br><span class="note">${esc(i.note)}</span>` : ""}</span><span class="q num">${esc(fmtQty(qty, i.unit))}</span></li>`;
    }).join("");
    const done = doneSteps[id] || {};
    const n = r.nutrition || {};
    const nut = (n.kcal || n.protein || n.salt) ? `<div class="nut num">
        <div><b>${n.kcal ?? "–"}</b><span>kcal</span></div>
        <div><b>${n.protein ?? "–"}</b><span>たんぱく質 g</span></div>
        <div><b>${n.salt ?? "–"}</b><span>塩分 g</span></div>
      </div><p class="muted" style="font-size:11.5px;margin:6px 0 0">栄養は1人分のおおよその目安です。</p>` : "";
    $("detailView").innerHTML = `
      <button class="back" type="button" data-back>← 一覧へ</button>
      <div class="dhead">
        ${r.category ? `<span class="cat">${esc(r.category)}</span>` : ""}
        <h2>${esc(r.title)}</h2>
        ${r.summary ? `<p class="sum">${esc(r.summary)}</p>` : ""}
        <div class="meta num">
          ${r.timeMin ? `<span>調理 ${esc(r.timeMin)}分</span>` : ""}
          ${r.cookedCount ? `<span>作った ${esc(r.cookedCount)}回${r.lastCooked ? `（最後 ${esc(r.lastCooked)}）` : ""}</span>` : ""}
          ${r.source ? `<span>出どころ：${esc(r.source)}</span>` : ""}
        </div>
        ${(r.tags||[]).length ? `<div class="tags">${r.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
        <div class="actions">
          <button class="btn ${r.favorite?"on":""}" type="button" data-act="fav">${r.favorite?"★ お気に入り":"☆ お気に入りにする"}</button>
          <button class="btn" type="button" data-act="cooked">今日作った</button>
          <button class="btn danger ${delArmed?"armed":""}" type="button" data-act="del">${delArmed?"本当に削除する":"削除"}</button>
        </div>
      </div>
      <div class="cols">
        <div class="panel">
          <h3>材料
            <span class="serv">
              <button type="button" data-sv="-1" aria-label="1人分減らす">−</button>
              <output class="num">${sv}人分</output>
              <button type="button" data-sv="1" aria-label="1人分増やす">＋</button>
            </span>
          </h3>
          ${sv !== base ? `<p class="scaled">元のレシピは${base}人分。分量を${sv}人分に計算し直しています。</p>` : ""}
          <ul class="ing">${ings || '<li class="muted">材料が登録されていません</li>'}</ul>
          ${nut}
        </div>
        <div class="right">
          <div class="panel">
            <h3>作り方</h3>
            <ol class="steps">${(r.steps||[]).map((s,i)=>`<li data-step="${i}" class="${done[i]?"done":""}">${esc(s)}</li>`).join("")}</ol>
            <p class="muted" style="font-size:12px;margin:8px 0 0">終わった手順はタップすると線が引かれます。</p>
          </div>
          ${r.tips ? `<div class="tips"><h3>コツ・アレンジ</h3><p>${esc(r.tips)}</p></div>` : ""}
          <div class="panel">
            <h3>うちのメモ</h3>
            <textarea id="memo" placeholder="例：子どもには生姜少なめ。次は小松菜を倍にする">${esc(r.memo||"")}</textarea>
            <div class="row"><button class="btn" type="button" data-act="memo">メモを保存</button><span id="memoStatus" class="status" role="status"></span></div>
          </div>
          <div class="ask">
            <p>味や人数、材料の差し替えはチャットで頼めます。</p>
            <p><code>レシピ帳の「${esc(r.title)}」を減塩にして</code>　<code>${esc(r.title)}を豚肉で作りたい</code></p>
          </div>
        </div>
      </div>`;
  }

  function render(){ renderList(); renderDetail(); }

  /* ---------- 操作 ---------- */
  $("q").addEventListener("input", e => { query = e.target.value; renderList(); });
  $("chips").addEventListener("click", e => {
    const b = e.target.closest("[data-f]"); if (!b) return;
    filter = b.dataset.f; renderList();
  });
  window.addEventListener("hashchange", () => { delArmed = false; renderDetail(); window.scrollTo(0,0); });

  $("detailView").addEventListener("click", async e => {
    const id = currentId(); const r = recipes.find(x => x.id === id);
    if (e.target.closest("[data-back]")){ location.hash = ""; return; }
    if (!r) return;
    const sv = e.target.closest("[data-sv]");
    if (sv){
      const base = Number(r.servings) || 1;
      servingsOverride[id] = Math.max(1, Math.min(20, (servingsOverride[id] || base) + Number(sv.dataset.sv)));
      renderDetail(); return;
    }
    const st = e.target.closest("[data-step]");
    if (st){ const m = doneSteps[id] = doneSteps[id] || {}; m[st.dataset.step] = !m[st.dataset.step]; renderDetail(); return; }
    const act = e.target.closest("[data-act]"); if (!act) return;
    if (!db){ showNotice("保存できません。claude.ai にサインインした状態で開いてください。"); return; }
    const ref = db.collection("recipes").doc(id);
    const today = new Date(); const ymd = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
    try{
      if (act.dataset.act === "fav") await ref.update({favorite: !r.favorite, updatedAt: new Date().toISOString()});
      if (act.dataset.act === "cooked") await ref.update({cookedCount: (Number(r.cookedCount)||0) + 1, lastCooked: ymd});
      if (act.dataset.act === "memo"){
        await ref.update({memo: $("memo").value, updatedAt: new Date().toISOString()});
        $("memoStatus").textContent = "保存しました";
      }
      if (act.dataset.act === "del"){
        if (!delArmed){ delArmed = true; renderDetail(); return; }
        delArmed = false; await ref.delete(); location.hash = "";
      }
    }catch(err){ showNotice("保存できませんでした（" + (err && (err.code || err.message) || "エラー") + "）。もう一度お試しください。"); }
  });

  function showNotice(t){ const n = $("notice"); n.textContent = t; n.hidden = !t; }

  /* ---------- データ ---------- */
  render();
  const timer = setTimeout(() => { if (!loaded){ showNotice("レシピを読み込めませんでした。claude.ai にサインインした状態で開き直してください。"); } }, 10000);
  (async () => {
    const d = window.claude && await window.claude.use("db");
    if (!d){ clearTimeout(timer); showNotice("この表示ではレシピ帳を読み込めません。claude.ai にサインインした状態で開いてください。"); return; }
    db = d;
    db.collection("recipes").onSnapshot(snap => {
      clearTimeout(timer); loaded = true; showNotice("");
      recipes = snap.docs.map(s => ({id: s.id, ...s.data()})).filter(r => r.title)
        .sort((a,b) => String(b.createdAt||"").localeCompare(String(a.createdAt||"")));
      // メモ欄を編集中なら上書きしない
      const memo = $("memo"); const editing = memo && document.activeElement === memo; const draft = editing && memo.value;
      render();
      if (editing && $("memo")){ $("memo").value = draft; $("memo").focus(); }
    }, err => { clearTimeout(timer); showNotice("レシピを読み込めませんでした（" + (err && err.code || "error") + "）。ページを開き直してください。"); });
  })();
})();
</script>
